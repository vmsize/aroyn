<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Aroyn — Home</title><link rel="icon" type="image/png" href="/assets/aroyn-mark.png">
  <script>(function(){try{var m=localStorage.getItem('veyra.theme.mode')||'dark';var a=localStorage.getItem('veyra.theme.accent')||'steel';var r=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.dataset.theme=r;document.documentElement.dataset.themeMode=m;document.documentElement.dataset.accent=a;}catch(e){document.documentElement.dataset.theme='dark';document.documentElement.dataset.accent='steel';}})();</script>
  <link rel="stylesheet" href="/assets/styles/tokens.css">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <link rel="stylesheet" href="/assets/styles/responsive.css">
  <link rel="stylesheet" href="/assets/styles/home.css?v=portal1">
</head>
<body class="home-page">
  <div class="app-splash" aria-hidden="true">
    <span class="splash-line"></span>
    <img class="splash-mark" src="/assets/aroyn-mark.png" alt="">
  </div>
  <div class="route-progress"></div>

  <div class="aroyn-field-background" aria-hidden="true">
    <div id="aroyn-field-root" class="aroyn-field-mount"></div>
  </div>

  <main class="home-main">
    <section class="landing-hero">
      <div class="landing-brand">
        <img class="landing-logo" src="/assets/aroyn-mark.png" alt="Aroyn logo">
        <h1>Aroyn</h1>
        <a class="landing-cta landing-portal" href="/dashboard/" aria-label="Open dashboard">
          <span class="portal-bracket" aria-hidden="true">[</span>
          <span class="portal-label">Open dashboard</span>
          <span class="portal-bracket" aria-hidden="true">]</span>
        </a>
      </div>
    </section>

    <section class="dashboard-preview-section" aria-label="Aroyn dashboard preview">
      <figure class="product-preview">
        <img src="/assets/dashboard-demo-illustrative.png?v=brand2" width="1852" height="1220" alt="Aroyn dashboard example with illustrative Greedy Growers activity and account data">
      </figure>

    </section>
  </main>

  <footer class="home-policy-footer" aria-label="Project notices">
    <nav aria-label="Privacy and terms"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/cookies/">Cookies &amp; storage</a></nav>
    <span>Aroyn · vmsize</span>
  </footer>

  <button class="btn background-motion-toggle" type="button" data-background-motion aria-pressed="false" hidden>Pause background</button>
  <script type="module" src="/assets/js/pages/home.js"></script>
</body>
</html>
